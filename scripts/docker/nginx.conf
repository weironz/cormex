# ══════════════════════════════════════════════════════════
#  cormex-web 的 nginx 配置
#
#  这个镜像只做一件事：把 Flutter Web 的静态产物发出去。
#  **它不反代 API** —— 路由分流在外面那层（traefik / 你自己的 nginx）做。
#
#  为什么不在这里反代：反代要知道记忆服务在哪，而那是一个部署事实，
#  不是镜像事实。写进来就等于每换一个部署都要重建镜像 ——
#  这个镜像刻意不认识任何域名（见 Dockerfile.web 里 CORMEX_BASE_URL 那段）。
#
#  外面那层要做的分流（以 /api 为例）：
#      Host(你的域名) && PathPrefix(/api)  →  cormex:8080，剥掉 /api
#      Host(你的域名)                      →  这个容器:80
# ══════════════════════════════════════════════════════════

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Let CLI clients find the API without guessing from the web URL.
    location = /.well-known/cormex {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"api_base":"/api"}';
    }

    # Flutter Web 是单页应用：深链接在磁盘上没有对应文件，必须回落到
    # index.html，否则刷新页面就是 404。
    #
    # ★ 这条回落也是「前缀丢了」那个 bug 的放大器：API 请求要是没带上
    #   /api 前缀，就会落到这里，拿回一份 200 的 index.html。客户端随即
    #   报「JSON 解析失败」—— 一句完全不像路由配错的错。
    #   `CormexApi.resolveBase` 那侧钉了一条测试专门防这个。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 缓存策略 ──────────────────────────────────────────
    #
    # index.html 与 flutter_bootstrap.js **绝不能缓存**。
    # Flutter 的资源文件名不带内容哈希，版本更新靠 bootstrap 里的
    # buildId 与 version.json 判定 —— 把入口缓存住，用户会拿着旧的
    # bootstrap 去加载新的 main.dart.js，症状是白屏且控制台里
    # 只有一句语焉不详的加载失败。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /version.json {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # canvaskit 与 assets 的内容随版本走，可以放心长缓存。
    # 它们是这个应用里最大的几个文件（canvaskit.wasm 好几 MB）。
    location ~* ^/(canvaskit|assets)/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    # ── 压缩 ──────────────────────────────────────────────
    # main.dart.js 未压缩是 MB 级的。不开 gzip 时首屏在慢网络上非常难看。
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/wasm image/svg+xml;

    # ── 安全响应头 ────────────────────────────────────────
    # 刻意**不设** Content-Security-Policy：Flutter Web 需要
    # wasm-unsafe-eval 与 blob: worker，一份写错的 CSP 会让应用直接白屏，
    # 而且是那种「本地开发好好的，上线才白」的错法。要收紧就在外层代理
    # 用 headers middleware 加，那样改一次不用重建镜像。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # 容器编排层的探活打这里。不进 access log，否则日志里全是它
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
