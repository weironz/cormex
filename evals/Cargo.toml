[package]
name = "cortex-evals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex retrieval-quality evaluation -- without it, tuning is just superstition"
publish = false

[dependencies]
cortex-core.workspace = true
cortex-llm.workspace = true
cortex-store.workspace = true
cortex-memory.workspace = true
tokio.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The versions follow the workspace declaration; no version number is written again here.
# The evaluation and the code being evaluated have to compile against **one and the same**
# sqlx -- two coexisting copies of sqlx-core make `Store`'s types fail to line up and the
# build fails outright (the same root cause as the comment on pgvector in the root Cargo.toml).
chrono.workspace = true
sqlx.workspace = true
