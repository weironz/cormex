[package]
name = "cormex-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Cormex storage layer: sqlx repositories and the sync_log writer"

[dependencies]
cormex-core.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
pgvector.workspace = true
chrono.workspace = true

[dev-dependencies]
dotenvy.workspace = true
futures.workspace = true
# Only for `tests/migrations_are_immutable.rs`, which pins each applied
# migration by hash. sqlx hashes the whole file, so a comment edit is a schema
# incident -- see that test's header for the deployment it stopped halfway.
sha2 = "0.10"
# Only for `tests/search.rs`: the Chinese cases need jieba's segmentation,
# because `to_tsvector('simple', …)` does not segment Chinese at all — the whole
# sentence becomes one lexeme. A dev-dependency, not a dependency: the direction
# `cormex-core ← cormex-memory` and `cormex-store` beside it must not be
# reversed in the library itself.
cormex-memory.workspace = true
