[package]
name = "cormex-transcript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-side parsers: logical bytes from an agent's session file to normalized transcript events"

[dependencies]
cormex-proto.workspace = true
cormex-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[dev-dependencies]
# The fixture sampler is a dev tool, not part of the crate: it needs the CLI's
# discovery and the memory crate's redaction scanner, and neither belongs in a
# parser's dependency tree
cormex = { workspace = true }
cormex-memory.workspace = true
tempfile = "3"
directories = "6"
anyhow.workspace = true
