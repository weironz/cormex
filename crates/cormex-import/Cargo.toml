[package]
name = "cormex-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cormex-core.workspace = true
# What the parsers produce is exactly a `NewEpisodeRequest` -- the reason this crate exists
# is to make the CLI, the local agent and cormexd **emit the very same request bodies**
cormex-proto.workspace = true

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
# Exports arrive as the zip the vendor mailed; reading it here means the CLI and
# the server unpack them the same way. Deflate only, like the CLI's own use.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# Selects flate2's default (pure Rust) backend, as the CLI does; `zip` alone leaves it unset
flate2 = "1"
