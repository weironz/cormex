[package]
name = "cortex-llm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cortex 供应商层：封装 goose-providers，多 LLM 可切换"

[dependencies]
cortex-core.workspace = true
# 只依赖 goose-providers：它已 `pub use goose_provider_types::{base, conversation, model, ...}`
# 把类型层整个透出来。根 Cargo.toml 给 goose-provider-types 也写了
# `features = ["rustls-tls"]`，但该 crate 根本没有这个 feature（alpha.1/alpha.5 都没有，
# TLS 后端只由 goose-providers 的 feature 转发给 reqwest），直接引用会解析失败。
goose-providers.workspace = true
# goose 的 `Tool` 就是 rmcp 的。goose-provider-types 没有把 rmcp 再导出一次，
# 只能自己引一份 —— 版本与 goose 一致，靠 cargo 的 feature 统一保证是同一个类型。
# 根 Cargo.toml 里没有这条，按约定在本 crate 内写完整声明。
rmcp = { version = "1.8", default-features = false }
# 图像块要把 &[u8] 编成 base64。goose 内部已经用了 0.22，钉同一个大版本
# 就不会多出一份 base64 实现。同上，根 Cargo.toml 不归本任务维护，写完整声明。
base64 = "0.22"
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
dotenvy.workspace = true
tracing-subscriber.workspace = true
