[package]
name = "cormex-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Cormex client ↔ server wire protocol: DTOs and the tool confirmation loop"

[dependencies]
cormex-core.workspace = true
# **There is no `cormex-agent` here, and it must not be added back.**
#
# There was one once, because `confirm::risk_str` needed `cormex_agent::Risk`. The price was
# that this **wire protocol** crate dragged the entire agent (the loop + the tools + the
# sandbox) into its dependency tree -- so anyone who only wanted the memory layer had to
# compile the agent along with it, while the memory layer is the half meant to be open
# sourced on its own.
# That conversion is now `Risk::as_wire`, living right next to the enum itself.
#
# `/llm/stream` passes goose's native Message / Tool / ProviderUsage straight through (see
# src/llm.rs: translating them into OpenAI's shape would lose prompt caching and thinking
# blocks).
#
# **Optional, and behind the default-on `llm` feature.** `cormex-llm` is the provider layer:
# it pulls in goose-providers, reqwest and a TLS stack. The capture CLI (`crates/cormex`)
# needs this crate for its DTOs and its catalog and makes no model call of its own -- it
# talks to the server's `/llm/stream`, which is the whole point of that endpoint. Dragging
# the provider layer into a static single binary for one module it never names is pure
# weight, so the CLI depends on this crate with `default-features = false`.
cormex-llm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true

[features]
default = ["llm"]
llm = ["dep:cormex-llm"]
