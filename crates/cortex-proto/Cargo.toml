[package]
name = "cortex-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Cortex client ↔ server wire protocol: DTOs and the tool confirmation loop"

[dependencies]
cortex-core.workspace = true
# **There is no `cortex-agent` here, and it must not be added back.**
#
# There was one once, because `confirm::risk_str` needed `cortex_agent::Risk`. The price was
# that this **wire protocol** crate dragged the entire agent (the loop + the tools + the
# sandbox) into its dependency tree -- so anyone who only wanted the memory layer had to
# compile the agent along with it, while the memory layer is the half meant to be open
# sourced on its own.
# That conversion is now `Risk::as_wire`, living right next to the enum itself.
#
# `/llm/stream` passes goose's native Message / Tool / ProviderUsage straight through (see
# src/llm.rs: translating them into OpenAI's shape would lose prompt caching and thinking
# blocks).
cortex-llm.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
