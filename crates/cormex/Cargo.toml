[package]
name = "cormex"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Cormex capture CLI: reads AI agent session files and sends them to a Cormex server"

# A lib *and* a bin: the end-to-end test in P1-12 drives the sync engine
# directly rather than shelling out, and `main.rs` should be nothing but
# argument parsing and exit-code mapping.
[lib]
name = "cormex"
path = "src/lib.rs"

[[bin]]
name = "cormex"
path = "src/main.rs"

[dependencies]
# **`default-features = false`**: the CLI needs the DTOs and the catalog, and
# makes no model call of its own -- it talks to the server's `/llm/stream`.
# Turning the `llm` feature off keeps goose-providers and a TLS stack out of a
# static single binary. See `crates/cormex-proto/Cargo.toml`.
cormex-proto.workspace = true
cormex-core.workspace = true
# The ChatGPT / Claude export splitter, shared with the server's projector so
# there is one parser for that format rather than two that drift
cormex-transcript.workspace = true
# `export_json`: the zip a vendor mails, unpacked the same way the server does
cormex-import.workspace = true

clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "time", "process"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
# The local state database (D22). `bundled` so that a static binary has no
# libsqlite3 dependency on the target machine -- which is the whole point of
# shipping one binary per platform.
rusqlite = { version = "0.37", features = ["bundled"] }
zstd = "0.14"
# Reading the export tar. The same crate the server uses to build it.
tar = "0.4"
# `cormex update`: `tar` unpacks but does not decompress, and the release's
# archives are gzipped. `flate2` is already in the tree through `zip`'s sibling
# dependencies, so this adds a second use of it rather than a second copy.
flate2 = "1"
sha2 = "0.10"
keyring = "3"
directories = "6"
fs4 = "0.13"
async-trait.workspace = true
rpassword = "7"
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
globset = "0.4"
regex = { workspace = true }
walkdir = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# `cormex update`: `release.yml` packs the Windows binary into a `.zip`, so this
# is the only platform that has to unpack one. Turn every default feature off
# and take the inflate side of `flate2` alone -- the defaults pull in
# aes / bzip2 / lzma / zstd / ppmd for archives this binary will never read, and
# `deflate-flate2` reuses the `flate2` + miniz_oxide pair already compiled in.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"
tar = "0.4"
zstd = "0.14"
# A fake server for the login test: `axum` is already in the workspace, and a
# mock object would assert the calls were made rather than that the second one
# carried the token the first one returned
tokio = { workspace = true, features = ["net"] }
axum.workspace = true
tower = { version = "0.5", features = ["util"] }
