[package]
name = "cormex-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Cormex memory engine: tokenization / embedding / extraction / four-way retrieval"

[dependencies]
cormex-core.workspace = true
cormex-store.workspace = true
cormex-llm.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
jieba-rs.workspace = true
regex.workspace = true
chrono.workspace = true
reqwest.workspace = true
# In-process ONNX inference. **Not compiled by default** -- see the comment on [features] below
fastembed = { workspace = true, optional = true }

[features]
default = []

# Run the embedding model straight inside the cormexd process (fastembed → ONNX Runtime).
#
# Off by default, not because it works badly, but because of the three prices it exacts as a
# **hard dependency**:
#
#   1. Intel Macs simply cannot build it: `ort-sys: no prebuilt binaries available
#      for target x86_64-apple-darwin`. That is a build-time failure, which not even
#      CORMEX_EMBED_BACKEND=hash can rescue
#   2. Every machine has to be able to obtain those 590 MB of weights. On a production node
#      where Hugging Face is completely unreachable, cormexd **starts as usual and /health
#      returns ok**, leaving only one log line about "falling back to mock" -- the memory is
#      fake and no light turns red
#   3. 12-second cold start, 1.0 GiB resident
#
# Turn it on when you need "one process, no external service at all":
#     cargo build -p cormexd --features cormex-memory/local-embed
local-embed = ["dep:fastembed"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The integration tests really do connect to a database: each test runs in a temporary
# schema of its own (see tests/common)
sqlx.workspace = true
dotenvy.workspace = true
chrono.workspace = true
# Stands up a fake /v1/embeddings service to check ApiEmbedder's on-the-wire format
# (see the module comment of tests/embed_api_wire.rs: a unit test cannot catch "where the
# request actually went")
axum.workspace = true

# These two are only compiled when local-embed is on. required-features rather than a
# `#![cfg(...)]` inside the file: the latter compiles the file into an empty crate (it
# builds, and tests nothing), while `cargo test --test fastembed` still returns success --
# and a test that passes silently is worse than not having the test at all
[[example]]
name = "embed_bench"
required-features = ["local-embed"]

[[test]]
name = "fastembed"
required-features = ["local-embed"]

[[test]]
name = "embed_env_empty"
required-features = ["local-embed"]
