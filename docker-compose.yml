# The compose project name. It prefixes every volume this file creates, which
# is why it matters more than a label: for a long time it said `cormex`, left
# over from before the memory service moved out of that repo, and the volumes
# on disk were called `cormex_pg_data` and friends. Production inherited the
# same prefix and is now stuck with it -- see the ★ section in
# `deploy/docker-compose.prod.yml`, where four volumes have to be declared
# `external` under names nobody can change.
#
# ⚠️ Renaming the project **orphans any dev volumes you already have**. That is
# fine here and only here: dev data is disposable, `just up` re-seeds it. Doing
# the same to production would create empty volumes, and the symptom would not
# be an error -- it would be "the database is suddenly empty".
name: cormex

# ─── About every `${CORMEX_BIND_ADDR:-127.0.0.1}:` below ────────────────────
#
# Ports bind to the **loopback** by default instead of `0.0.0.0`; what that takes away is
# the **LAN** side: a development machine with Wi-Fi on used to be holding a postgres with
# a default password, and an object store, out in front of the entire subnet.
#
# # But it does not keep the sandbox containers out -- this was measured, do not take it at face value
#
# The assumption was that this change shut the sandbox out as well. On a real machine it
# **does not hold** (Docker Desktop / Windows):
#
#   from a sandbox → cormex-postgres:5432 (DNS name)                    refused   ← topological isolation works
#   from a sandbox → host.docker.internal:15432 (bound to 0.0.0.0)      reachable
#   from a sandbox → host.docker.internal:15432 (after rebinding to 127.0.0.1)  **still reachable**
#
# Docker Desktop's port forwarding runs inside that Linux virtual machine, and what a
# container reaches through `host.docker.internal` is the forwarder's side of it -- binding
# to loopback or not makes no difference at all.
# Uglier still, the same run also got through to the postgres and the object store of
# **another project** on this machine -- neither of which is governed by this compose file,
# so changing anything here cannot reach them either.
#
# The only thing measured to actually work is putting the sandbox network on
# `internal: true` (a container then has no default route at all, `host.docker.internal`
# still resolves but nothing routes there, and all three lines above are refused).
# The price is that **published ports stop working on an internal network** (measured too:
# curl from the host cannot connect), and cormexd currently reverse-proxies into the
# containers through exactly those published ports -- so that step has to be taken together
# with a dual-homed relay container, noted as B3 on the roadmap.
#
# On native Linux (which is what production is), binding to loopback **is** a boundary:
# docker-proxy binds to 127.0.0.1 in the host netns, and a container arriving through the
# bridge gateway 172.17.0.1 never touches it.
# That line is reasoning, not measurement -- there is no native Linux docker on this machine
# to verify it on. And the production `deploy/docker-compose.yml` has not a single `ports:`
# entry, so it is not exposed in the first place.
#
# To connect from another machine on the LAN, set `CORMEX_BIND_ADDR=0.0.0.0`.
#
# **cormexd's own port is not in this group**: a container has to be able to reach it in
# order to call back (writing memory, pulling history), and that route is narrowed down by
# the sandbox token to 5 allowlisted routes -- that door is left open deliberately.
services:

  # ─── cormexd: the memory service itself ────────────────────────────
  #
  # This one **runs on its own**: Postgres + object storage + a key for one LLM provider,
  # and nothing else in front. The agent side (the conversation loop, container
  # orchestration) is not in this repository, and should not be -- someone using this as a
  # memory layer has no use for a single line of it.
  cormexd:
    build:
      context: .
      dockerfile: scripts/docker/Dockerfile.cormexd
    image: ${CORMEXD_IMAGE:-cormex/cormexd:local}
    container_name: cormex-cormexd
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-cormex}:${POSTGRES_PASSWORD:-cormex_dev_only}@postgres:5432/${POSTGRES_DB:-cormex}
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: ${S3_BUCKET:-cormex-blobs}
      S3_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cormexadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cormex_dev_only}
      CORMEXD_BIND: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-cormexd=info,cormex_memory=info,warn}
      # With no credential configured at all, cormexd **refuses to start**. Switching that
      # off has to be said out loud -- see auth.rs
      CORMEX_AUTH: ${CORMEX_AUTH:-}
      CORMEX_TOKEN_SHA256: ${CORMEX_TOKEN_SHA256:-}
      CORMEX_EMBED_BACKEND: ${CORMEX_EMBED_BACKEND:-api}
      CORMEX_EMBED_MODEL: ${CORMEX_EMBED_MODEL:-}
      CORMEX_EMBED_ENDPOINT: ${CORMEX_EMBED_ENDPOINT:-}
      CORMEX_EMBED_API_KEY: ${CORMEX_EMBED_API_KEY:-}
      CORMEX_LLM_PROVIDER: ${CORMEX_LLM_PROVIDER:-deepseek}
      CORMEX_LLM_MODEL: ${CORMEX_LLM_MODEL:-}
      CORMEX_LLM_CHEAP_MODEL: ${CORMEX_LLM_CHEAP_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORMEX_SECRET_KEY: ${CORMEX_SECRET_KEY:-}
    ports:
      - "${CORMEXD_PORT:-8080}:8080"
    networks:
      - default
  # ─── Postgres + pgvector ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cormex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cormex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cormex_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-cormex}
      # Chinese tokenization happens on the Rust side with jieba-rs, so no tokenizer
      # extension is needed here
      #
      # [Only takes effect on a fresh database] Extra arguments to initdb. data-checksums
      # gives every page a checksum, which is the precondition for "a silent bit flip can be
      # noticed" -- without it, corruption propagates all the way into the backups.
      # An existing database cannot have this switch flipped; use
      # `just pg-enable-checksums` to retrofit it offline (see docs/operations.md).
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:---data-checksums}
    # WAL archiving. archive_mode can only be set at startup, hence in command rather than in SQL.
    #   archive_timeout=60  force a segment switch every 60s even with no writes -- this is what bounds the RPO
    #   archive_command     the standard form from the docs: fail if the target already exists, never overwrite silently
    #                       (two WAL segments with the same name and different contents are a disaster;
    #                        better to stop and be seen)
    #   summarize_wal=on    PG17's WAL summarizer, the precondition for pg_basebackup --incremental.
    #                       Incremental is not in use yet, but turning it on is what keeps that upgrade road open
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=mkdir -p /backup/wal && test ! -f /backup/wal/%f && cp %p /backup/wal/%f
      - -c
      - archive_timeout=60
      - -c
      - wal_level=replica
      - -c
      - wal_compression=on
      - -c
      - summarize_wal=on
    ports:
      - "${CORMEX_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Backups land in a host directory rather than a named volume: scripts have to be able
      # to read them directly, rclone has to be able to push them to a second store, and
      # they have to still be findable after every container is gone. Defaults to
      # ./data/backup, and the repository's data/ is already in .gitignore.
      - ${CORMEX_BACKUP_DIR:-./data/backup}:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cormex} -d ${POSTGRES_DB:-cormex}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── RustFS (S3-compatible object storage) ──────────────────────────
  rustfs:
    image: rustfs/rustfs:latest
    container_name: cormex-rustfs
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    environment:
      # One volume in development. Four-volume erasure coding requires four **physically
      # independent disks**, and on a development machine with a single disk that is fake
      # redundancy -- RustFS detects the shared device and refuses to start anyway.
      # Production deployments switch to /data/rustfs{0...3} mounted on genuinely separate disks.
      RUSTFS_VOLUMES: /data
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: ${RUSTFS_UNSAFE_BYPASS_DISK_CHECK:-true}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cormexadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cormex_dev_only}
      # strict = a write is acknowledged only once it has hit the disk. The precondition for
      # "never lose anything"; do not turn it down to relaxed
      RUSTFS_DURABILITY_MODE: strict
      # RustFS has no per-bucket CORS interface, so allowed origins are a service-level setting.
      # Opened up in development so that Flutter Web can do presigned PUTs directly.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "${CORMEX_BIND_ADDR:-127.0.0.1}:${RUSTFS_API_PORT:-9000}:9000"      # S3 API
      - "${CORMEX_BIND_ADDR:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"  # console
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── The embedding service (OpenAI-compatible /v1/embeddings) ────────
  #
  # Lives in the `embed` profile and is **not started by default**. The reason: it is the
  # heaviest thing in this stack (bge-m3 fp32 weights are 2.2 GB, 2.5-3 GB resident), while
  # `just up` ought to mean "a database comes up and you can start working" -- it has no
  # business quietly eating 3 GB on a development machine.
  #
  #   docker compose --profile embed up -d     # to self-host it locally
  #
  # If you would rather not self-host, point .env at any OpenAI-compatible service:
  #
  #   CORMEX_EMBED_ENDPOINT=https://dashscope.aliyuncs.com/compatible-mode/v1
  #   CORMEX_EMBED_MODEL=text-embedding-v3
  #   CORMEX_EMBED_API_KEY=sk-...
  #
  # If neither road appeals, offline development can use CORMEX_EMBED_BACKEND=hash --
  # but bear in mind that **it is not a semantic space**, so retrieval-quality evaluation
  # results mean nothing on top of it.
  #
  # **The model has to be 1024-dimensional**: the schema hard-codes VECTOR(1024).
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: cormex-embeddings
    profiles: [embed]
    restart: unless-stopped
    command: >-
      --model-id ${CORMEX_EMBED_SERVED_MODEL:-BAAI/bge-m3}
      --port 80
      --auto-truncate
    environment:
      HF_HOME: /data
    ports:
      # During development cormexd runs on the host (not inside compose), so this has to be
      # mapped out. Matches .env:
      # CORMEX_EMBED_ENDPOINT=http://127.0.0.1:8090/v1/embeddings
      - "${CORMEX_BIND_ADDR:-127.0.0.1}:${CORMEX_EMBED_PORT:-8090}:80"
    volumes:
      - embed_models:/data
    healthcheck:
      # /health does not answer until the weights have finished loading, which makes it a
      # readiness probe as it is.
      # start_period gets 5 minutes: the first run has 2.2 GB to download
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 300s

  # ─── The one dual-homed exit from the sandbox network ─────────────────────────────
  #
  # Lives in the `sandbox` profile and is **not started by default** (same reason as
  # embeddings: `just up` should mean "a database comes up and you can start working").
  #
  #   docker compose --profile sandbox up -d      # or just sandbox-up
  #
  # It is attached to two networks at once:
  #   cormex-sandbox-net  internal, where the sandboxes live, **with no default route**
  #   default             an ordinary bridge, which is how it gets out
  #
  # That makes it the only point in this topology able to reach both sides, and it serves
  # both directions: egress (sandbox → the permitted outside world) and the reverse relay
  # (cormexd → a designated sandbox container).
networks:
  default:
    name: cormex_default

volumes:
  pg_data:
  rustfs_data:
  embed_models:

