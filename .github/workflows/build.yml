name: Build candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

# Build and publish for the same candidate cannot race, even across workflows.
concurrency:
  group: candidate-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}
  CORMEX_REPOSITORY: ${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
      - run: just _preflight "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.preflight.outputs.commit }}

  cli:
    needs: [preflight, checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            zigbuild: true
          - target: x86_64-apple-darwin
            os: macos-latest
            zigbuild: false
          - target: aarch64-apple-darwin
            os: macos-latest
            zigbuild: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            zigbuild: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            zigbuild: false
    defaults:
      run:
        shell: bash
    env:
      CLI_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.zigbuild
        run: |
          python3 -m pip install ziglang
          cargo install cargo-zigbuild --locked
      - run: just _build-cli "$RELEASE_TAG" "$CLI_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-cli-${{ matrix.target }}
          path: dist/${{ inputs.tag }}/
          if-no-files-found: error
          retention-days: 7

  images:
    needs: [preflight, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - uses: docker/setup-buildx-action@v3
      # Build, smoke-test, and export both images. No registry login or push.
      - run: just _build-images "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-images
          path: dist/${{ inputs.tag }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  candidate:
    needs: [preflight, cli, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          merge-multiple: true
          path: dist/${{ inputs.tag }}/
      - name: Aggregate exactly one complete candidate
        run: just _bundle "$RELEASE_TAG" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stage draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: just _stage "$RELEASE_TAG"
