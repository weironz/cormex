name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Formatting and static checks ────────────────────────
  lint:
    name: Formatting and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # What gets installed is stable; what actually runs is the 1.97.1 pinned in
      # rust-toolchain.toml -- rustup's proxy sees the toolchain file and fetches that
      # itself (together with the rustfmt / clippy the file declares). The version is
      # **deliberately not written out a second time** here: a copy hard-coded into YAML
      # will drift from the toolchain file sooner or later, and the symptom of that drift
      # is "CI passes, the local machine does not"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      # `-D warnings` goes on the command line rather than through the `RUSTFLAGS`
      # environment variable: RUSTFLAGS becomes part of the compilation fingerprint, so the
      # lint and test jobs would each build their own copy of the dependencies and
      # Swatinem's cache would never hit across them; and it applies to the whole
      # dependency tree, so a single warning in a third-party crate could turn our CI red.
      # After `--` on the command line it only applies to this workspace's crates.
      #
      # `--locked`: a Cargo.lock that is in the repository has to be taken at its word.
      # pgvector's sqlx dependency range spans a semver group, and letting it float pulls
      # sqlx back to 0.8 and leaves two copies of sqlx-core coexisting (51 compile errors,
      # see CLAUDE.md). Without this flag the lock file can be silently rewritten, and the
      # rewrite happens in CI's temporary directory where nobody will ever see it
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A broken intra-doc link fails nothing until a reader clicks it and lands
      # on nothing -- and then concludes they failed to check out part of the
      # repository. This gate was added after a sweep found 14 of them, most
      # predating the split: three pointed at items with no definition anywhere
      # (`Live::extract_permit`, `DelegatedTokens::touch`, `Self::conflict`) and
      # one at a `docs/` directory this repository does not have.
      #
      # `--no-deps`: dependencies' own docs are not ours to keep tidy, and
      # building them would multiply the runtime for no signal.
      - name: rustdoc links
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links

  # ── Tests ──────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # A pinned version rather than `cargo install sqlx-cli`: the latter has to be
      # compiled from scratch on every CI run, costing minutes, while all that is needed
      # here is a binary that can run migrate
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.9.0 --no-default-features --features rustls,postgres --locked

      # ★ The two migration sets **have to be run separately, each with its version table
      #   in its own schema**. Running them as two commands is not enough on its own:
      #   `_sqlx_migrations` follows the connection's `search_path`, so two invocations
      #   against the same default schema share one version table. The second one then
      #   reports `migration 20260807000001 was previously applied but is missing in the
      #   resolved migrations` -- it is looking at the first set's bookkeeping.
      #
      #   The runtime path does this correctly (`Store::migrate_global` creates the schema
      #   and opens its own connection with `search_path=cortex_auth`, precisely because
      #   `search_path` is a connection-level property and cannot be changed on a live
      #   pool). CI has to mirror it rather than assume two commands are two namespaces.
      #
      #   `public` has to stay on the path as well, for a different reason: the `ulid`
      #   and `sha256` DOMAINs live there and the global set's columns are typed with
      #   them. Drop it and 20260810000002 fails with `type "ulid" does not exist` --
      #   which reads like a missing migration rather than a missing schema on the
      #   path. `state.rs` puts exactly this pair on the accounts pool, same note.
      - name: Apply migrations
        run: |
          psql "$DATABASE_URL" -c 'CREATE SCHEMA IF NOT EXISTS cortex_auth'
          sqlx migrate run --source migrations
          sqlx migrate run --source migrations-global \
            --database-url "$DATABASE_URL?options=-csearch_path%3Dcortex_auth%2Cpublic"
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cormex_test
          PGPASSWORD: postgres

      # ★ `--include-ignored` cannot be left out. Every test that needs a database is marked
      #   `#[ignore]`, and the default invocation skips them -- while in CI's output
      #   **"ignored" and "ok" look equally green**. Without this flag the gate covers only
      #   the pure-logic half, leaving the retrieval / transaction / migration half (which
      #   is to say the core of this product) uncovered.
      - name: cargo test
        run: cargo test --workspace --locked -- --include-ignored
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cormex_test

    # pgvector rather than the official postgres image: the retrieval leg needs the
    # `vector` extension, and without it the very first migration blows up. The version
    # follows deploy's compose (pg17), removing one more source of "CI went green but
    # production exploded"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cormex_test
        ports: ["5432:5432"]
        # Without this health-cmd the job would start running migrations while Postgres is
        # not yet accepting connections -- the failure is intermittent, and nobody ever
        # goes and investigates an intermittent CI failure
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  # ── The web client ─────────────────────────────────────
  #
  # Its own job rather than a step of the Rust ones: nothing is shared, and running it in
  # parallel keeps the wall clock at max() instead of the sum.
  #
  # Worth stating why this exists at all -- until the browser was published as an image,
  # nothing in CI ever looked at those 3000-odd lines of Dart. A Rust-only pipeline going
  # green said precisely nothing about whether the page still compiled.
  #
  # The Flutter version is pinned to the same one Dockerfile.web builds with. Letting CI
  # float to whatever `stable` means today produces the worst kind of disagreement: CI
  # green, release image red, and the difference invisible in the diff.
  app:
    name: Web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true
      - name: flutter pub get
        working-directory: app
        run: flutter pub get
      - name: flutter analyze
        working-directory: app
        run: flutter analyze
      - name: flutter test
        working-directory: app
        run: flutter test
