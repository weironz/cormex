name: Release

# ══════════════════════════════════════════════════════════
#  Release pipeline -- builds and pushes cormex's docker image.
#
#  Triggers: pushing a `v*` tag, or a manual workflow_dispatch (which requires a tag).
#
#  ── Images only, no bare binaries ─────────────────────────
#  This is a memory service: it needs Postgres + pgvector to run at all, and compose is
#  the only shape it is actually deployed in. Shipping a "download and go" binary would
#  offer an installation path that does not work. Anyone who does not want docker goes
#  through `cargo install --git`.
#
#  ── The version line is independent of Cortex ─────────────
#  This is the whole point of the split: Cormex and Cortex release their own versions,
#  sharing no tags and not aligning with each other. What is checked below is the
#  `[workspace.package] version` in **this repository's** Cargo.toml, which has nothing
#  to do with Cortex's version number.
# ══════════════════════════════════════════════════════════

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to use for a manual release (of the form v0.1.0)
        required: true

# Read-only. This pipeline creates no release and changes nothing in the repository; its
# only write operations happen on two registries (through secrets, not GITHUB_TOKEN)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════════════════════
  #  The preflight gate -- before anything gets compiled
  #
  #  The image has to compile an entire Rust dependency tree, which on a cold cache runs
  #  to a quarter of an hour. Something like a mismatched version number, which takes a
  #  second to check, has no business being discovered after all that.
  # ══════════════════════════════════════════════════════════
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # The tag is resolved once, here. `github.ref_name || inputs.tag` is deliberately not
      # used: on a workflow_dispatch, ref_name is the **branch name** and therefore always
      # truthy, so the right-hand side of `||` can never be reached, and a manual release
      # would push things like `cormex:vmain`
      - name: Resolve the tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag '$tag' is not valid, it must be vX.Y.Z"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Parsed with tomllib rather than grep: `version = ` appears a dozen times in
      # Cargo.toml (once per workspace dependency), which line grep catches depends on the
      # order of the file, and when it catches the wrong one it does not complain -- it
      # quietly compares an unrelated number
      - name: Version number matches the tag
        run: |
          python3 - <<'PY'
          import sys, tomllib
          want = "${{ steps.resolve.outputs.version }}"
          got = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          if got != want:
              print(f"::error::the tag is v{want}, but Cargo.toml's workspace version is {got}")
              print("The image tag and `cortexd --version` would each state a different number, and both would compile.")
              sys.exit(1)
          print(f"OK, versions agree: {got}")
          PY

      # ── The lock-file gate ────────────────────────────────
      #
      # The `cargo build --release` inside the Dockerfile has **no `--locked`**, and this
      # pipeline is only allowed to change files under .github/workflows/ -- which means
      # "use the lock file when building" cannot be passed in from the build-push-action
      # side (the Dockerfile takes no ARG, and cargo has no equivalent environment variable).
      #
      # So the guarantee is moved forward to here: `--locked` makes cargo fail outright when
      # "what resolution produces" disagrees with Cargo.lock, without resolving and without
      # touching the file. What this guards against is precisely the pgvector landmine --
      # its sqlx dependency range spans a semver group, and allowing re-resolution pulls
      # sqlx back to 0.8 and leaves two copies of sqlx-core coexisting (see CLAUDE.md).
      # Once the lock file has been confirmed self-consistent here, the flagless build
      # inside the image can only follow it.
      #
      # The real fix is to add `--locked` to the Dockerfile's cargo build; this gate is
      # only its stand-in.
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo.lock is consistent with the manifests
        run: cargo metadata --locked --format-version 1 > /dev/null

  # ══════════════════════════════════════════════════════════
  #  The docker image -- one image, pushed to two registries
  #
  #  ACR is the one production actually pulls from (the nodes are in China, where Docker
  #  Hub is either slow or has to go through a third-party mirror -- and mirrors of that
  #  kind cache tag→digest, which is the trap of "you pulled an old image and cannot even
  #  tell"). The Docker Hub copy is the off-site replica.
  #
  #  linux/amd64 only. arm64 would have to be built under QEMU emulation, and compiling a
  #  whole Rust dependency tree that way runs into hours -- besides which nobody has
  #  verified this image on arm64, and shipping an arm64 image that has never once been
  #  started is exactly what this pipeline exists to avoid.
  # ══════════════════════════════════════════════════════════
  image:
    name: Image cormex
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # The build context is the repository root: the Dockerfile has to COPY crates/,
          # evals/, migrations/ and migrations-global/, and the last two are the
          # directories the **compile-time** macro `sqlx::migrate!` reads -- leave them out
          # of the context and it blows up at compile time, while a local build stays green
          context: .
          file: scripts/docker/Dockerfile.cortexd
          platforms: linux/amd64
          push: true
          # ★ **Must be turned off.** buildx by default attaches a provenance attestation to
          # the image, which turns the result into an OCI index containing an empty
          # descriptor of type `application/vnd.oci.empty.v1+json` -- and Aliyun ACR does
          # not recognize that media type, so the push fails outright with
          # `denied: unknown manifest class`.
          #
          # A local `docker build` going green all the way proves nothing: it never pushes
          provenance: false
          # Only the specific version is tagged, **never latest**. Production pins a
          # version and has to come back to the same one after a restart; a tag that drifts
          # turns "which version is running in production" into a question nobody can
          # settle.
          #
          # The image is called cormex (not cortexd) -- that is the product name, while the
          # binary inside is still called cortexd
          tags: |
            willdockerhub/cormex:v${{ needs.preflight.outputs.version }}
            registry.cn-shenzhen.aliyuncs.com/willspace/cormex:v${{ needs.preflight.outputs.version }}
          cache-from: type=gha,scope=cormex
          cache-to: type=gha,mode=max,scope=cormex

      # The image has to be genuinely started once. Discovering after the push that it does
      # not come up leaves no fix but releasing the next version -- and by then it is
      # already sitting in the registry.
      #
      # What gets pulled is the ACR copy rather than the one built locally: the local one
      # has never made the push/pull round trip, so manifest-level problems (exactly the
      # provenance kind above) are invisible on it
      - name: Smoke test
        run: |
          set -euo pipefail
          v="${{ needs.preflight.outputs.version }}"
          img="registry.cn-shenzhen.aliyuncs.com/willspace/cormex:v$v"
          docker pull "$img"
          # `--version` is the only real code path that can be executed in CI with no
          # dependencies: clap answers it before anything connects to a database, so no
          # Postgres is required.
          # What it proves is that **dynamic linking works** -- problems of the mismatched
          # glibc version kind (the build base and the runtime base being different
          # releases) blow up right here, instead of waiting to report
          # `GLIBC_2.xx not found` when the container starts in production
          docker run --rm "$img" --version | tee /tmp/v.txt
          grep -qF "$v" /tmp/v.txt \
            || { echo "::error::the version inside the image is not $v"; exit 1; }
          # The migrations travel with the image (the deployment machine has no Rust
          # toolchain, and `just prod-migrate` runs them inside the container). Both sets
          # have to be present; the symptom of the global one missing is a new tenant
          # failing halfway through account creation
          docker run --rm --entrypoint /bin/sh "$img" -c \
            'test -d /opt/cortex/migrations && test -d /opt/cortex/migrations-global' \
            || { echo "::error::the migration directories are missing from the image"; exit 1; }
