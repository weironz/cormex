name: Release

# ══════════════════════════════════════════════════════════
#  发布流水线 —— 构建并推送 cormex 的 docker 镜像。
#
#  触发：推 `v*` tag，或手动 workflow_dispatch（要填 tag）。
#
#  ── 只有镜像，没有裸二进制 ────────────────────────────────
#  这是记忆服务：它要 Postgres + pgvector 才跑得起来，实际部署形态
#  只有 compose 一种。发一份「下载即用」的二进制会给出一个用不了的
#  安装路径。想不用 docker 的人走 `cargo install --git`。
#
#  ── 版本线独立于 Cortex ──────────────────────────────────
#  这是拆分的重点：Cormex 与 Cortex 各发各的版本，不共享 tag、
#  不互相对齐。下面核对的是**本仓库** Cargo.toml 里的
#  `[workspace.package] version`，与 Cortex 的版本号无关。
# ══════════════════════════════════════════════════════════

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 手动发布时使用的标签（形如 v0.1.0）
        required: true

# 只读。这条流水线不建 release、不改仓库内容，
# 唯一的写操作发生在两个 registry 上（靠 secrets，不是靠 GITHUB_TOKEN）
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ══════════════════════════════════════════════════════════
  #  前置闸门 —— 在编译任何东西之前
  #
  #  镜像要编一整棵 Rust 依赖树，冷缓存按十几分钟计。版本号对不上
  #  这种一秒能查出来的事，不该等到那之后才发现。
  # ══════════════════════════════════════════════════════════
  preflight:
    name: 前置检查
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # tag 只在这里解析一次。刻意不写 `github.ref_name || inputs.tag`：
      # ref_name 在 workflow_dispatch 上是**分支名**、永远为真，
      # `||` 右边那一侧于是永远取不到，手动发布会打出一堆
      # `cormex:vmain` 之类的东西
      - name: 解析 tag
        id: resolve
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::tag '$tag' 不合法，必须是 vX.Y.Z"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # 用 tomllib 解析而不是 grep：`version = ` 在 Cargo.toml 里出现十几次
      # （每个 workspace 依赖都有），grep 抓到的是哪一行取决于文件顺序，
      # 而它抓错时不会报错，只会安静地比对一个不相干的数
      - name: 版本号与 tag 一致
        run: |
          python3 - <<'PY'
          import sys, tomllib
          want = "${{ steps.resolve.outputs.version }}"
          got = tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"]
          if got != want:
              print(f"::error::tag 是 v{want}，但 Cargo.toml 的 workspace 版本是 {got}")
              print("镜像 tag 与 `cortexd --version` 会各说一个数，而两边都编译得过。")
              sys.exit(1)
          print(f"✓ 版本一致：{got}")
          PY

      # ── 锁文件闸门 ────────────────────────────────────────
      #
      # Dockerfile 里那句 `cargo build --release` **没有 `--locked`**，
      # 而这条流水线只被允许改 .github/workflows/ 下的文件 —— 也就是说
      # 「构建时用锁文件」这件事没法从 build-push-action 那一侧传进去
      # （Dockerfile 不接任何 ARG，cargo 也没有等价的环境变量）。
      #
      # 于是把保证前移到这里：`--locked` 让 cargo 在「解析结果与 Cargo.lock
      # 不一致」时直接失败，不做解析也不改文件。要防的正是 pgvector 那条雷 ——
      # 它的 sqlx 依赖范围跨 semver 组，一旦允许重新解析就会把 sqlx 拉回 0.8，
      # 造成两份 sqlx-core 共存（见 CLAUDE.md）。锁文件在这里被确认是自洽的，
      # 镜像里那次不带标志的构建也就只会照它来。
      #
      # 真正的修法是给 Dockerfile 的 cargo build 加上 `--locked`，
      # 这道闸门只是它的替身。
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo.lock 与清单自洽
        run: cargo metadata --locked --format-version 1 > /dev/null

  # ══════════════════════════════════════════════════════════
  #  docker 镜像 —— 一个镜像，推两个 registry
  #
  #  ACR 是生产实际拉取的那个（节点在国内，Docker Hub 在那里要么慢、
  #  要么得经第三方镜像站，而那类站点缓存 tag→digest，是「拉到旧镜像
  #  还看不出来」的陷阱）。Docker Hub 那份是异地副本。
  #
  #  只做 linux/amd64。arm64 得靠 QEMU 模拟构建，编一整棵 Rust 依赖树
  #  按小时计，而且没人在 arm64 上验证过这个镜像 —— 发一个从没被启动过
  #  的 arm64 镜像，正是这条流水线要避免的事。
  # ══════════════════════════════════════════════════════════
  image:
    name: 镜像 cormex
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: registry.cn-shenzhen.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          # 构建上下文是仓库根：Dockerfile 要 COPY crates/、evals/、
          # migrations/ 与 migrations-global/，其中后两个是
          # `sqlx::migrate!` 这个**编译期**宏要读的目录 ——
          # 漏进上下文的话在编译期就炸，而本机构建照样是绿的
          context: .
          file: scripts/docker/Dockerfile.cortexd
          platforms: linux/amd64
          push: true
          # ★ **必须关掉。** buildx 默认给镜像挂一份 provenance 证明，
          # 那会把结果变成一个 OCI index，里面带一个
          # `application/vnd.oci.empty.v1+json` 的空描述符 ——
          # 而阿里云 ACR 不认这个 media type，push 时直接
          # `denied: unknown manifest class`。
          #
          # 本地 `docker build` 一路绿灯也说明不了什么：它根本不 push
          provenance: false
          # 只打具体版本，**不打 latest**。生产钉死版本，重启之后
          # 必须回到同一个；一个会漂移的 tag 会让「线上跑的是哪一版」
          # 变成一个查不清的问题。
          #
          # 镜像叫 cormex（不是 cortexd）—— 那是产品名，
          # 里头的二进制仍叫 cortexd
          tags: |
            willdockerhub/cormex:v${{ needs.preflight.outputs.version }}
            registry.cn-shenzhen.aliyuncs.com/willspace/cormex:v${{ needs.preflight.outputs.version }}
          cache-from: type=gha,scope=cormex
          cache-to: type=gha,mode=max,scope=cormex

      # 镜像必须被真的启动一次。推上去之后才发现起不来，就只能靠发下一版
      # 来修 —— 而那时它已经在 registry 里了。
      #
      # 拉的是 ACR 那份而不是本地 build 出来的那份：本地那份没经过
      # push/pull 一个来回，manifest 层面的问题（就是上面 provenance
      # 那一类）在它身上看不出来
      - name: 冒烟
        run: |
          set -euo pipefail
          v="${{ needs.preflight.outputs.version }}"
          img="registry.cn-shenzhen.aliyuncs.com/willspace/cormex:v$v"
          docker pull "$img"
          # `--version` 是唯一能在 CI 里无依赖执行的真实代码路径：
          # clap 在连数据库之前就把它答完了，所以不需要 Postgres。
          # 它证明的是**动态链接通的** —— glibc 版本对不上那一类问题
          # （构建底座与运行底座代号不一致）会在这里当场炸，
          # 而不是等到线上起容器时报一句 `GLIBC_2.xx not found`
          docker run --rm "$img" --version | tee /tmp/v.txt
          grep -qF "$v" /tmp/v.txt \
            || { echo "::error::镜像里的版本不是 $v"; exit 1; }
          # migration 随镜像走（部署机上不装 Rust 工具链，
          # `just prod-migrate` 直接在容器里跑）。两份都要在，
          # 少了全局那份的症状是新租户建号建到一半失败
          docker run --rm --entrypoint /bin/sh "$img" -c \
            'test -d /opt/cortex/migrations && test -d /opt/cortex/migrations-global' \
            || { echo "::error::镜像里缺 migration 目录"; exit 1; }
