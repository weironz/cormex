name: Publish candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft candidate tag (vX.Y.Z)
        required: true
        type: string
      checksum:
        description: Approved SHA-256 of the candidate SHA256SUMS file
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: candidate-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Configure required reviewers here. This job never builds or deploys.
    environment: production
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUNDLE_SHA256: ${{ inputs.checksum }}
      CORMEX_REPOSITORY: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Use the workflow ref's reviewed publisher, not executable code from an asset.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: extractions/setup-just@v3
      - uses: actions/setup-node@v4
        if: vars.PUBLISH_NPM == 'true'
        with:
          node-version: '22'
      - name: Verify, load, smoke-test, push, and publish the existing candidate
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          PUBLISH_NPM: ${{ vars.PUBLISH_NPM }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: just _publish "$RELEASE_TAG" "$BUNDLE_SHA256"
