# Control-node settings for the deployment playbook.
#
# The control node must be POSIX (Linux, macOS, WSL). Ansible cannot run on Windows
# itself -- see docs/deployment-guide.md for the container fallback `just` uses.
[defaults]
inventory = inventory.ini
host_key_checking = True
interpreter_python = auto_silent
stdout_callback = default
deprecation_warnings = False
retry_files_enabled = False
# A deploy that waits two minutes for /api/health is slow, not broken.
timeout = 30

[ssh_connection]
# Reuse the SSH connection across tasks: the target runs a handful of short commands.
pipelining = True
