# Copy to inventory.ini (gitignored) and fill in the deployment host.
#
# Deliberately an inventory file rather than "a hostname in justfile": the address
# of our deployment is not part of the source tree. See AGENTS.md -- this repository
# is public, and the node, domain and account live only on the machine that runs it.
#
#   cp inventory.example.ini inventory.ini
#   chmod 600 inventory.ini
#
# The key below is the default; override with ansible_ssh_private_key_file=... if
# the control node uses another one. Both the native and the container paths expand
# `~` on the control node, so the same line works either way.

[cormex]
cormex.example.internal ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/id_ed25519

[cormex:vars]
# Where the deployment checkout lives on that host (the directory that holds
# docker-compose.yml, .env and optionally compose.override.yaml).
cormex_dir=/srv/cormex/deploy

# The loopback address the stack answers on *on that host*. The playbook asks the
# running service what it is; it does not trust `docker ps`.
cormex_api_base=http://127.0.0.1:8080

# Only needed when the stack runs under a different compose project than the one
# pinned by `name:` in docker-compose.yml (CI or a smoke host). Leave empty on a
# normal deployment.
cormex_project=
