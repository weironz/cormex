---
# Both deployment modes use the same host-side lock, receipts and verification.
# No build or registry publication runs on the managed host.
- name: Deploy Cormex
  hosts: cormex
  gather_facts: false
  tasks:
    - name: Require a pinned release and explicit upgrade approval
      ansible.builtin.assert:
        that:
          - cormex_version is defined
          - cormex_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
          - cormex_from_version is not defined or cormex_expectations is defined
        fail_msg: "use deploy TAG for an existing pin, or deploy-upgrade FROM TAG BUNDLE_SHA256"
        quiet: true

    - name: Look for the deployment files
      ansible.builtin.stat:
        path: "{{ cormex_dir }}/{{ item }}"
      loop: [docker-compose.yml, .env]
      register: deployment_files

    - name: Require the existing stack
      ansible.builtin.assert:
        that:
          - deployment_files.results[0].stat.exists
          - deployment_files.results[1].stat.exists
        fail_msg: "the deployment directory must contain docker-compose.yml and .env"
        quiet: true

    - name: Create a private directory for the shared deployment helpers
      ansible.builtin.tempfile:
        state: directory
        prefix: cormex-deploy-
      register: helper_directory
      changed_when: false

    - name: Run the shared deployment operation
      block:
        - name: Copy the stdlib deployment and identity checks
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../scripts/{{ item }}"
            dest: "{{ helper_directory.path }}/{{ item }}"
            mode: "0600"
          loop: [deploy.py, deploy_runtime.py, image_identity.py]
          changed_when: false

        - name: Copy only the approved public candidate expectations
          when: cormex_from_version is defined
          ansible.builtin.copy:
            content: "{{ cormex_expectations | to_nice_json }}"
            dest: "{{ helper_directory.path }}/expectations.json"
            mode: "0600"
          changed_when: false

        - name: Assemble the operation arguments
          ansible.builtin.set_fact:
            operation_args: >-
              {{ ['python3', '-I', helper_directory.path + '/deploy_runtime.py']
                 + (['upgrade', cormex_from_version, cormex_version, cormex_dir,
                     '--expectations', helper_directory.path + '/expectations.json']
                    if cormex_from_version is defined else ['reapply', cormex_version, cormex_dir])
                 + ['--base', cormex_api_base]
                 + (['--project', cormex_project] if (cormex_project | default('') | length) > 0 else [])
                 + (['--no-pull'] if cormex_from_version is not defined and not (cormex_pull | default(true) | bool) else [])
                 + (['--allow-plaintext'] if not (cormex_require_encryption | default(true) | bool) else []) }}

        - name: Deploy and verify the running server and Web
          ansible.builtin.command:
            argv: "{{ operation_args }}"
          register: deployment
          # Container IDs, rather than Compose's version-dependent progress text,
          # decide whether the operation changed the running stack.
          changed_when: deployment.rc == 0 and ((deployment.stdout_lines | last | from_json).changed | bool)

        - name: Report the completed operation and persistent receipt
          ansible.builtin.debug:
            msg: "{{ deployment.stdout_lines | last | from_json }}"
      always:
        - name: Remove temporary helpers while retaining the host receipt
          ansible.builtin.file:
            path: "{{ helper_directory.path }}"
            state: absent
          changed_when: false
