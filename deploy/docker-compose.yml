# ══════════════════════════════════════════════════════════
#  Cormex, self-contained. One host, one command.
#
#      cp .env.example .env      # then fill in the three credentials it names
#      docker compose up -d
#
#  It creates its own volumes, publishes to the loopback, and depends on
#  nothing outside this directory. Open http://127.0.0.1:8080.
#
#  This is the file the README points at. `docker-compose.prod.yml` beside it
#  is OUR deployment -- edge proxy, TLS, external volumes under names only our
#  node has. Read that one for the shape of a real deployment; run this one.
#
#  ── What it deliberately does NOT do ─────────────────────
#
#  * No TLS. Everything binds to 127.0.0.1, so the host is the boundary. Put a
#    real proxy in front before exposing any of it; the prod file shows how.
#  * No WAL archiving. Point-in-time recovery needs somewhere to archive to,
#    and a wrong archive_command is worse than none: Postgres treats a failing
#    archive as "archiving finished", completes recovery, promotes, and says
#    nothing at all. Set it up deliberately, with the prod file as reference.
#  * No embedding container by default. See the `embeddings` service.
# ══════════════════════════════════════════════════════════

name: cormex

# json-file has no ceiling by default, and one crash-looping service can fill
# the disk and take the host down with it.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Postgres + pgvector ───────────────────────────────
  postgres:
    image: pgvector/pgvector:pg17
    container_name: cormex-postgres
    restart: unless-stopped
    logging: *default-logging
    # No published port. For a psql prompt:
    #     docker compose exec postgres psql -U cormex
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cormex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: ${POSTGRES_DB:-cormex}
      # Only applies to a database being created here. Without checksums, a bit
      # flipped on disk is handed back to the caller as data, with no error.
      POSTGRES_INITDB_ARGS: --data-checksums
    shm_size: 256mb
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cormex} -d ${POSTGRES_DB:-cormex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── RustFS (S3-compatible object store) ───────────────
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.0-beta.6}
    container_name: cormex-rustfs
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - "no-new-privileges:true"
    # Published because the browser fetches blobs directly from here, which is
    # a different origin than the page -- hence the CORS line below.
    ports:
      - "${CORMEX_BIND_ADDR:-127.0.0.1}:${CORMEX_S3_PORT:-9000}:9000"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      # The only admin surface in this stack. Turn it on for a look, not for good.
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cormexadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set a real password in .env}
      # ★ An exact origin, never `*`. With `*`, any site's JavaScript can read
      # and write this bucket through a visitor's browser.
      RUSTFS_CORS_ALLOWED_ORIGINS: ${CORMEX_PUBLIC_URL:-http://127.0.0.1:8080}
      RUSTFS_OBS_LOGGER_LEVEL: warn
      # Single volume. Erasure coding wants four independent physical disks;
      # pretending otherwise makes RustFS refuse to start, which is correct.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/ >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Embeddings (optional, profile `embed`) ────────────
  #
  # Vectorising has two routes, and this file defaults to the first:
  #
  #   1. CORTEX_EMBED_BACKEND=api against a hosted endpoint -- no container, no
  #      resident memory, one network call per vectorisation.
  #   2. The same, pointed at this container.
  #
  # Route 2 is far heavier than the server itself, which is why it is off by
  # default: bge-m3 is 568M parameters, roughly 2.2 GB of fp32 weights, and TEI
  # sits at 2.5-3 GB resident once loaded. On a 2-core / 4 GB box it does not
  # fit -- starting it by default would OOM the reference deployment at `up`.
  #
  #     # in .env
  #     COMPOSE_PROFILES=embed
  #     CORTEX_EMBED_ENDPOINT=http://embeddings/v1/embeddings
  #     CORTEX_EMBED_MODEL=bge-m3
  #
  # ★ The model must be 1024-dimensional -- the schema pins VECTOR(1024).
  # OpenAI's text-embedding-3-small is 1536 and large is 3072; either is
  # rejected on the first response, with an error that says what to do.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    container_name: cormex-embeddings
    profiles: [embed]
    restart: unless-stopped
    logging: *default-logging
    command: ["--model-id", "${CORMEX_EMBED_MODEL_ID:-BAAI/bge-m3}", "--port", "80"]
    volumes:
      - embed_models:/data

  # ── The memory service ────────────────────────────────
  cormex:
    image: ${CORMEX_IMAGE:-${CORMEX_REGISTRY:-willdockerhub}/cormex:${CORMEX_VERSION:?pin a version in .env, for example v0.1.11}}
    container_name: cormex
    restart: unless-stopped
    logging: *default-logging
    # The server exits when the database is unreachable, so you will see a
    # restart loop until postgres is healthy. That is intended -- do not "fix"
    # it by pointing the server at a mock backend, which would leave it serving
    # a database of fabricated facts.
    #
    # depends_on only governs `up`; it has no say in restarts after a crash.
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_started
    environment:
      # Service names, not localhost. This is the easiest thing to get wrong
      # when moving the server into a container, and the symptom is "cannot
      # connect to the database" with a configuration that reads correctly.
      DATABASE_URL: postgres://${POSTGRES_USER:-cormex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cormex}
      # Two endpoints, one bucket: the server takes the in-network hop, the
      # browser is handed the published one.
      S3_ENDPOINT: http://rustfs:9000
      S3_PUBLIC_ENDPOINT: ${CORMEX_S3_PUBLIC_URL:-http://127.0.0.1:9000}
      S3_BUCKET: ${S3_BUCKET:-cormex-blobs}
      S3_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cormexadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}

      CORTEXD_BIND: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-cortexd=info,cortex_memory=info,warn}

      # ★ Authentication. The server refuses to start without this, on purpose:
      # the 0.0.0.0 bind above is exactly what it guards against.
      #
      #     docker run --rm willdockerhub/cormex:v0.1.11 --generate-token
      #
      # That prints the token once, and the hash to paste here. Only the hash
      # belongs on this machine.
      CORTEX_AUTH_TOKEN_SHA256: ${CORTEX_AUTH_TOKEN_SHA256:?required -- see .env.example for how to generate it}

      # ★ These have no usable default. An empty endpoint fails at the first
      # vectorisation rather than at startup -- so after `up`, read /health and
      # confirm `embedding.model` says `api:<the model you set>`.
      CORTEX_EMBED_BACKEND: ${CORTEX_EMBED_BACKEND:-api}
      CORTEX_EMBED_ENDPOINT: ${CORTEX_EMBED_ENDPOINT:-}
      CORTEX_EMBED_MODEL: ${CORTEX_EMBED_MODEL:-}
      CORTEX_EMBED_API_KEY: ${CORTEX_EMBED_API_KEY:-}
      # Per-request ceiling. 10 is not tuning, it is the lowest common
      # denominator: TEI allows 32, some hosted endpoints stop at 10.
      CORTEX_EMBED_BATCH: ${CORTEX_EMBED_BATCH:-}

      # LLM provider. Keys come from the environment, never from a tracked file.
      #
      # This block is an explicit allowlist: a variable set in .env but not
      # named here never reaches the process. That is the trap of allowlists --
      # an omitted knob does not exist in production, and the way it surfaces
      # is that someone changes it, restarts, and nothing happens.
      CORTEX_LLM_PROVIDER: ${CORTEX_LLM_PROVIDER:-deepseek}
      CORTEX_LLM_MODEL: ${CORTEX_LLM_MODEL:-}
      CORTEX_LLM_CHEAP_MODEL: ${CORTEX_LLM_CHEAP_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - workspace:/var/lib/cortex/workspace

  # ── The memory browser ────────────────────────────────
  #
  # Same origin as the API (which lives under /api), so the server needs no
  # CORS configuration at all. The image knows no hostname -- it asks for the
  # relative prefix `/api`, which the browser resolves against the page.
  web:
    image: ${CORMEX_WEB_IMAGE:-${CORMEX_REGISTRY:-willdockerhub}/cormex-web:${CORMEX_VERSION:?pin a version in .env}}
    container_name: cormex-web
    restart: unless-stopped
    logging: *default-logging
    # No depends_on. Static assets may come up first: while the API is still
    # starting, the page says so and retries -- and that is exactly the moment
    # you most want the page to open. depends_on would turn "the server is
    # restarting" into "the site will not load".

  # ── The /api split ────────────────────────────────────
  #
  # See proxy.conf. This is the one job traefik does in the production file.
  # Without it the browser's /api calls land on the SPA fallback in the web
  # image and come back 200 with index.html.
  proxy:
    image: nginx:alpine
    container_name: cormex-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${CORMEX_BIND_ADDR:-127.0.0.1}:${CORMEX_PORT:-8080}:80"
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  pg_data:
  rustfs_data:
  workspace:
  embed_models:
