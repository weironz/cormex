# ══════════════════════════════════════════════════════════
#  The one piece of routing a self-contained deployment needs.
#
#  The `cormex-web` image deliberately does not proxy the API: where the server
#  lives is a deployment fact, not an image fact, so the image knows no
#  hostname at all and asks for the relative prefix `/api`. Something has to
#  resolve that. In our production stack it is traefik; here it is this file.
#
#  ★ Without this split the failure is silent, not loud. An unrouted /api
#    request falls through to the SPA fallback in the web image and comes back
#    **200 with index.html**; the client then reports "JSON parse failed",
#    which looks like anything except a routing mistake.
# ══════════════════════════════════════════════════════════

# WebSocket upgrade passthrough. `/sync` is a WebSocket, and without these two
# lines it connects, hangs, and times out -- with no error anywhere.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Uploads are attachments; the default 1m rejects anything bigger with a
    # 413 that surfaces as a generic upload failure.
    client_max_body_size 512m;

    # ── /api → the server, prefix stripped ────────────────
    location /api/ {
        # ★ Resolve at request time, not at config load.
        #
        # A bare `proxy_pass http://cormex:8080` is resolved once when nginx
        # reads this file. If the server container is not up yet -- which is
        # normal on a first `up`, it waits for postgres -- nginx exits with
        # "host not found in upstream" and never retries. Going through a
        # variable defers the lookup to each request, so the proxy survives the
        # server being down and starts working the moment it is back.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cormex_upstream cormex;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$cormex_upstream:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        # ★ SSE. Buffering on (the default) makes a streamed answer arrive in
        # one lump when the turn ends -- the feature still "works", it just
        # stops being a stream, and nothing reports an error.
        proxy_buffering off;
        proxy_cache off;
        # A turn can think for a long time before the first byte.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ── everything else → the browser ─────────────────────
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $web_upstream web;
        proxy_pass http://$web_upstream:80;

        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
