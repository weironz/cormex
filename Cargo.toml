[workspace]
resolver = "3"
members = [
    "crates/cortex-core",
    "crates/cortex-llm",
    "crates/cortex-store",
    "crates/cortex-memory",
    "crates/cortex-blob",
    "crates/cortex-proto",
    "crates/cortex-import",
    "crates/cortexd",
    "evals",
]

[workspace.package]
# The authoritative home of the version number. app/pubspec.yaml, the git tag and the docker
# image tag all have to agree with it, which `just version-check` (= scripts/check-version.sh)
# polices in CI and in the release pipeline.
version = "0.1.8"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/weironz/cormex"

[workspace.dependencies]
cortex-core = { path = "crates/cortex-core" }
cortex-import = { path = "crates/cortex-import" }
cortex-llm = { path = "crates/cortex-llm" }
cortex-store = { path = "crates/cortex-store" }
cortex-memory = { path = "crates/cortex-memory" }
cortex-proto = { path = "crates/cortex-proto" }
cortex-blob = { path = "crates/cortex-blob" }

# Provider layer: lifted from goose (Apache-2.0).
# Depends on goose-providers only -- it already pub-uses the entire type layer of
# goose-provider-types, while goose-provider-types itself **has no rustls-tls feature**
# (write one and dependency resolution fails outright); the TLS backend is forwarded to
# reqwest by goose-providers alone.
goose-providers = { version = "0.1.0-alpha", default-features = false, features = ["rustls-tls"] }

# Async runtime
tokio = { version = "1.53", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"

# Server side
axum = { version = "0.8", features = ["macros", "ws"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Database
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio", "tls-rustls", "postgres", "json", "chrono", "uuid", "macros", "migrate",
] }
pgvector = { version = "0.4", features = ["sqlx"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
# Note that reqwest 0.13 renamed the TLS feature to rustls (it is no longer rustls-tls)
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "query", "rustls"] }

# Docker API client. Used by cortexd's DockerRunner to start / stop user sandbox containers
# (see docs/sandbox.md, section 7).
#
# **Do not hand-roll a unix socket on top of hyper**: Docker's API version negotiation is
# full of traps, and this is exactly the "tedious but industrially proven part" CLAUDE.md
# talks about.
#
# Turn the default features off and enable them one at a time: the defaults pull in ssl
# (openssl) and chrono, while we neither talk to a remote daemon nor need its time types --
# dragging in a second TLS implementation would leave it coexisting with reqwest's rustls,
# which is precisely the shape Cargo.lock has already been caught in once
# `pipe` is **mandatory on Windows**: `connect_with_local_defaults` goes to
# `/var/run/docker.sock` on unix (compiled unconditionally) and to npipe on Windows, and the
# latter hides behind this feature. Without it the development machine will not compile, and
# the error points into bollard's internals -- with nothing to suggest that a single feature
# is missing. Windows for development, Linux for production; it has to compile on both.

# WebSocket client. Used by the local agent to reverse-proxy /ws (see
# cortex-local/src/ws_proxy.rs).
#
# **Deliberately no TLS feature whatsoever**: this crate does not establish the connection.
# reqwest establishes it and hands it over through `from_raw_socket`. Enabling
# `rustls-tls-*` pulls in a second rustls configuration, so "the certificates reqwest
# trusts" and "the certificates WS trusts" become two different sets -- on a self-hosted
# deployment with a self-signed certificate, HTTP works while WS cannot connect, and there
# is nowhere the two facts can be seen to be related.
#
# The version has to match the one inside axum (verify with `cargo tree -i
# tokio-tungstenite`): two coexisting copies make types other than `bytes::Bytes` fail to
# line up, and the error surfaces at the conversion site rather than at the dependency.

# Memory engine
jieba-rs = "0.10"
fastembed = "5"
# Write-side credential filtering (cortex-memory/src/redaction.rs).
# The version follows whichever copy jieba-rs has already pulled in; promoting it to a
# direct dependency adds nothing at all to the compile
regex = "1"

# OS-level sandbox (enabled for Linux targets only).
# The choice was lifted from codex (Apache-2.0): its linux-sandbox is an orchestration of
# exactly these two crates.
# codex's own crates are not published to crates.io and are deeply coupled to
# codex-protocol, so only the foundation and the policy could be taken.

# Text diff. The de facto standard for doing this in Rust (the place highlight.js occupies
# for code highlighting), Apache-2.0. Writing Myers yourself is precisely the kind of work
# the first rule of CLAUDE.md forbids outright -- tedious, industrially proven, and getting
# it wrong buys you a diff that merely "looks right".
#
# Only `text` is enabled (`TextDiff` and unified diff both sit behind that feature), with
# the default unicode segmentation turned off: we compare by **line** only and have no use
# for grapheme clusters, while it drags in a Unicode table several MB in size.
#
# Note that `default-features = false` turns `text` off along with the rest -- and then
# `TextDiff` is no longer in the crate root, so the error reads "no TextDiff in the root",
# which looks like a version mismatch but is in fact one missing feature.

# Infrastructure
ulid = { version = "3", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
